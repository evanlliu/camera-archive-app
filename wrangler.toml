name = "scene-camera-worker"
main = "src/index.js"
compatibility_date = "2026-06-01"

[vars]
# 改成你的 GitHub 用户名/组织名、照片私有仓库名、分支名。
GITHUB_OWNER = "your-github-username"
GITHUB_REPO = "camera-archive-private"
GITHUB_BRANCH = "main"
# 改成你的 GitHub Pages 来源，例如 https://yourname.github.io
CORS_ORIGIN = "https://your-github-username.github.io"
# 单张上传最大 MB。Cloudflare Free 当前请求体上限通常是 100MB，但 Worker 内存也要考虑。
MAX_UPLOAD_MB = "50"
