<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>场景相机</title>
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="场景相机" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>场景相机</h1>
      <p id="storageLine">正在检查存储状态…</p>
    </div>
    <button id="settingsBtn" class="ghost">设置</button>
  </header>

  <main>
    <section class="status-card">
      <div class="stat"><strong id="statPhotos">0</strong><span>本地照片</span></div>
      <div class="stat"><strong id="statPending">0</strong><span>待同步</span></div>
      <div class="stat"><strong id="statFailed">0</strong><span>失败</span></div>
      <div class="stat"><strong id="statTrash">0</strong><span>回收站</span></div>
    </section>

    <section class="toolbar">
      <button id="newFolderBtn">新建分类</button>
      <button id="captureBtn" class="primary">拍照</button>
      <button id="syncBtn">同步</button>
      <button id="exportBtn">导出 ZIP</button>
      <label class="buttonLike">
        导入 ZIP
        <input id="importInput" type="file" accept=".zip,application/zip" hidden />
      </label>
    </section>

    <section class="notice" id="noticeBox" hidden></section>

    <nav id="breadcrumbs" class="breadcrumbs"></nav>

    <section>
      <h2>子分类</h2>
      <div id="folderList" class="folder-list"></div>
    </section>

    <section>
      <h2>照片</h2>
      <div id="photoGrid" class="photo-grid"></div>
    </section>
  </main>

  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <h2>同步设置</h2>
      <label>
        Cloudflare Worker 地址
        <input id="apiBaseInput" placeholder="https://你的-worker.workers.dev" autocomplete="off" />
      </label>
      <label>
        App 密码
        <input id="appPasswordInput" type="password" placeholder="Worker 里的 APP_PASSWORD" autocomplete="current-password" />
      </label>
      <p class="hint">密码只保存在这台设备的浏览器本地。真正的 GitHub Token 只放在 Cloudflare Worker Secret 里。</p>
      <menu>
        <button value="cancel">取消</button>
        <button id="saveSettingsBtn" value="default" class="primary">保存</button>
      </menu>
    </form>
  </dialog>

  <dialog id="photoDialog">
    <form method="dialog" class="dialog-card photo-dialog-card">
      <img id="photoPreview" alt="照片预览" />
      <textarea id="photoNote" placeholder="备注，可选"></textarea>
      <p id="photoMeta" class="hint"></p>
      <menu>
        <button id="saveNoteBtn" value="default">保存备注</button>
        <button id="deletePhotoBtn" value="default" class="danger">删除</button>
        <button value="cancel">关闭</button>
      </menu>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <script src="./app.js" type="module"></script>
</body>
</html>
