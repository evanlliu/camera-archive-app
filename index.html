<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>场景相机</title>
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="场景相机" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">📷</div>
      <div class="brand-copy">
        <h1>场景相机</h1>
        <p id="storageLine">正在检查存储状态…</p>
      </div>
    </div>
    <button id="settingsBtn" type="button" class="icon-button" aria-label="设置">设置</button>
  </header>

  <main class="app-shell">
    <section class="hero-card" aria-label="当前分类">
      <div>
        <p class="eyebrow">当前分类</p>
        <h2 id="currentFolderTitle">全部分类</h2>
        <p id="currentFolderMeta" class="muted-line">0 个子分类 · 0 张照片</p>
      </div>
      <button id="captureBtn" type="button" class="primary capture-main">拍照</button>
    </section>

    <section class="status-grid" aria-label="数据状态">
      <div class="stat synced-card"><strong id="statPhotos">0</strong><span>本地照片</span></div>
      <div class="stat pending-card"><strong id="statPending">0</strong><span>待同步</span></div>
      <div class="stat failed-card"><strong id="statFailed">0</strong><span>失败</span></div>
      <div class="stat trash-card"><strong id="statTrash">0</strong><span>回收站</span></div>
    </section>

    <section class="action-panel" aria-label="常用操作">
      <button id="newFolderBtn" type="button">新分类</button>
      <button id="syncBtn" type="button">同步</button>
      <button id="exportBtn" type="button">导出</button>
      <label class="buttonLike">
        导入
        <input id="importInput" type="file" accept=".zip,application/zip" hidden />
      </label>
    </section>

    <section class="notice" id="noticeBox" hidden></section>

    <section class="content-card path-card">
      <div class="section-title-row">
        <div>
          <p class="eyebrow">位置</p>
          <h3>分类路径</h3>
        </div>
      </div>
      <nav id="breadcrumbs" class="breadcrumbs"></nav>
    </section>

    <section class="content-card">
      <div class="section-title-row">
        <div>
          <p class="eyebrow">Folders</p>
          <h3>子分类</h3>
        </div>
        <span id="folderCount" class="pill">0 个</span>
      </div>
      <div id="folderList" class="folder-list"></div>
    </section>

    <section class="content-card photo-section">
      <div class="section-title-row">
        <div>
          <p class="eyebrow">Photos</p>
          <h3>照片</h3>
        </div>
        <span id="photoCount" class="pill">0 张</span>
      </div>
      <div id="photoGrid" class="photo-grid"></div>
    </section>
  </main>

  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Settings</p>
          <h2>同步设置</h2>
        </div>
      </div>
      <label>
        Cloudflare Worker 地址
        <input id="apiBaseInput" placeholder="https://你的-worker.workers.dev" autocomplete="off" />
      </label>
      <label>
        App 密码
        <input id="appPasswordInput" type="password" placeholder="Worker 里的 APP_PASSWORD" autocomplete="current-password" />
      </label>
      <div class="settings-actions">
        <button id="testConnectionBtn" type="button">测试连接并读取云端</button>
      </div>
      <p id="settingsStatus" class="settings-status" hidden></p>
      <p class="hint">密码只保存在这台设备的浏览器本地。真正的 GitHub Token 只放在 Cloudflare Worker Secret 里。保存后，每次打开会默认先加载 GitHub 云端数据。</p>
      <menu>
        <button value="cancel">取消</button>
        <button id="saveSettingsBtn" type="button" class="primary">保存</button>
      </menu>
    </form>
  </dialog>

  <dialog id="photoDialog" class="photo-dialog">
    <form method="dialog" class="dialog-card photo-dialog-card">
      <div class="photo-stage">
        <button id="prevPhotoBtn" type="button" class="photo-nav photo-nav-prev" aria-label="上一张">‹</button>
        <img id="photoPreview" alt="照片预览" />
        <button id="nextPhotoBtn" type="button" class="photo-nav photo-nav-next" aria-label="下一张">›</button>
      </div>
      <div class="photo-switch-row">
        <button id="prevPhotoTextBtn" type="button">上一张</button>
        <span id="photoCounter" class="pill">1 / 1</span>
        <button id="nextPhotoTextBtn" type="button">下一张</button>
      </div>
      <textarea id="photoNote" placeholder="备注，可选"></textarea>
      <p id="photoMeta" class="hint"></p>
      <menu>
        <button id="saveNoteBtn" type="button">保存备注</button>
        <button id="deletePhotoBtn" type="button" class="danger">删除</button>
        <button value="cancel">关闭</button>
      </menu>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <script src="./app.js" type="module"></script>
</body>
</html>
